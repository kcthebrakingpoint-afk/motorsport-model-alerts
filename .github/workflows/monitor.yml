name: Spark Model Monitor

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'seen_refs.json'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Spark Model monitor
        run: python monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save seen models
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- seen_refs.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_refs.json
            git commit -m "Update seen Spark models"
            git push
          fi
